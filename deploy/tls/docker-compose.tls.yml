# HTTPS(리버스 프록시) 배포용 스택.
#
# 기존 평문 HTTP 스택(/home/redmine-mcp-server, :3000)과 **병렬로** 뜨는 것을 전제로 한다.
# - 프로젝트 이름과 볼륨 이름을 명시적으로 고정해서 기존 스택과 절대 겹치지 않게 한다.
# - 포트는 루프백에만 바인딩한다. 외부 노출은 nginx(443)가 전담한다.
#
#   docker compose -f deploy/tls/docker-compose.tls.yml up -d --build
#
name: redmine-mcp-tls

services:
  redmine-mcp:
    build:
      context: ../..
      dockerfile: Dockerfile
    # 127.0.0.1 바인딩: LAN에서 :3001로 직접 평문 접근하는 경로를 원천 차단한다.
    # 3000이 아닌 3001인 이유는 기존 스택이 3000을 점유 중이기 때문.
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - REDMINE_URL=https://space.ncurity.com
      - MCP_HOST=0.0.0.0
      - MCP_PORT=3000
      - MCP_DATA_DIR=/data
      # OAuth issuer. 클라이언트가 실제로 접속하는 외부 HTTPS URL과 정확히 일치해야 한다.
      # 이 값이 곧 .well-known 메타데이터의 issuer/authorize/token 엔드포인트가 된다.
      - MCP_ISSUER_URL=https://mcp.ncurity.com
      # 유휴 세션 회수. 기본값과 동일하지만, 운영 서버에서 9103건이 쌓였던 문제라
      # 명시해 둔다. 0으로 두면 회수가 꺼지고 예전 누수 동작으로 돌아간다.
      - MCP_SESSION_TTL=1800000
      - MCP_SESSION_SWEEP_INTERVAL=60000
      - LOG_LEVEL=info
    volumes:
      # 기존 스택과 볼륨을 절대 공유하지 말 것. src/auth/store.ts 는 oauth-store.json 전체를
      # 메모리에 올린 뒤 통째로 덮어쓰므로, 두 인스턴스가 같은 파일을 쓰면 토큰이 서로 날아간다.
      - redmine-mcp-tls-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  redmine-mcp-tls-data:
    name: redmine-mcp-tls-data

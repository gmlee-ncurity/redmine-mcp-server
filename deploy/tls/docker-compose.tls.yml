# HTTPS 배포용 스택 (MCP 서버 + nginx TLS 종단).
#
# 기존 평문 HTTP 스택(/home/redmine-mcp-server, :3000)과 **병렬로** 뜨는 것을 전제로 한다.
#
#   docker compose -f deploy/tls/docker-compose.tls.yml up -d --build
#
# 192.168.71.103의 포트 현황을 반영한 구성이다:
#   3000 = 기존 redmine-mcp, 3001 = teams-mcp, 3002 = device-tracker,
#   8080 = dockerhub-ui, 443 = devel-dockerhub(레지스트리, 자체 TLS 종단)
# 443이 이미 점유돼 있어 nginx는 8443을 쓴다. 호스트에 nginx가 설치돼 있지 않으므로
# 컨테이너로 띄운다. 그 덕에 MCP 컨테이너는 호스트 포트를 아예 publish 하지 않는다.
name: redmine-mcp-tls

services:
  redmine-mcp:
    build:
      context: ../..
      dockerfile: Dockerfile
    # 호스트 포트 없음. nginx가 compose 네트워크로만 접근한다.
    expose:
      - "3000"
    environment:
      - REDMINE_URL=https://space.ncurity.com
      - MCP_HOST=0.0.0.0
      - MCP_PORT=3000
      - MCP_DATA_DIR=/data
      # OAuth issuer. 클라이언트가 실제로 접속하는 외부 HTTPS URL과 정확히 일치해야 한다.
      # 이 값이 곧 .well-known 메타데이터의 issuer/authorize/token 엔드포인트가 된다.
      # 포트가 443이 아니므로 issuer에도 포트를 반드시 포함한다.
      - MCP_ISSUER_URL=https://mcp.ncurity.com:8443
      # MCP_DANGEROUSLY_ALLOW_INSECURE_ISSUER_URL 은 절대 설정하지 않는다.
      # 기존 스택은 이 플래그로 SDK의 HTTPS 검사를 끈 탓에 실패가 클라이언트로 밀렸다.
      #
      # 유휴 세션 회수. 기본값과 동일하지만, 운영 서버에서 9103건이 쌓였던 문제라
      # 명시해 둔다. 0으로 두면 회수가 꺼지고 예전 누수 동작으로 돌아간다.
      - MCP_SESSION_TTL=1800000
      - MCP_SESSION_SWEEP_INTERVAL=60000
      - LOG_LEVEL=info
    volumes:
      # 기존 스택과 볼륨을 절대 공유하지 말 것. src/auth/store.ts 는 oauth-store.json 전체를
      # 메모리에 올린 뒤 통째로 덮어쓰므로, 두 인스턴스가 같은 파일을 쓰면 토큰이 서로 날아간다.
      - redmine-mcp-tls-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8443:8443"
    volumes:
      - ./nginx/mcp.ncurity.com.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets/mcp-proxy.inc:/etc/nginx/snippets/mcp-proxy.inc:ro
      # 호스트에 미리 배치한 *.ncurity.com 와일드카드 인증서 (런북 2번 참조)
      - /etc/ssl/ncurity-wildcard:/etc/nginx/ssl/ncurity-wildcard:ro
    depends_on:
      - redmine-mcp
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  redmine-mcp-tls-data:
    name: redmine-mcp-tls-data

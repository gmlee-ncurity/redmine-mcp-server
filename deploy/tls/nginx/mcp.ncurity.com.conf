# /etc/nginx/conf.d/mcp.ncurity.com.conf
#
# Claude Code --HTTPS--> nginx(443) --HTTP--> redmine-mcp-tls (127.0.0.1:3001)
#
# OAuth 토큰 교환은 TLS를 강제하므로(루프백만 예외) 이 계층이 반드시 필요하다.

server {
    listen 80;
    listen [::]:80;
    server_name mcp.ncurity.com;

    # certbot --webroot 를 쓸 경우를 대비해 ACME 경로만 열어둔다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mcp.ncurity.com;

    ssl_certificate     /etc/letsencrypt/live/mcp.ncurity.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.ncurity.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:MCP_TLS:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/mcp.access.log;
    error_log  /var/log/nginx/mcp.error.log;

    location / {
        proxy_pass http://127.0.0.1:3001;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- SSE(GET /mcp) 필수 설정 ---
        # 이 4줄이 없으면 스트림이 nginx 버퍼에 갇혀 세션이 즉시 죽는다.
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # 장시간 유지되는 SSE 스트림이 read timeout 으로 끊기지 않게 한다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# /etc/nginx/conf.d/mcp.ncurity.com.conf
#
# Claude Code --HTTPS--> nginx(443) --HTTP--> redmine-mcp-tls (127.0.0.1:3001)
#
# OAuth 토큰 교환은 TLS를 강제하므로(루프백만 예외) 이 계층이 반드시 필요하다.
#
# 인증서는 기존 *.ncurity.com 와일드카드를 재사용한다. 공인 CA(Sectigo) 발급이라
# 클라이언트 측 CA 설정이 전혀 필요 없고, 이름은 내부 DNS에만 등록하므로
# 서비스가 외부에 노출되지도 않는다.
#
# MCP 서버를 추가할 때는 이 파일을 복사해 **새 서브도메인**으로 만든다.
# 와일드카드가 모든 서브도메인을 덮으므로 인증서 작업은 추가로 없다.
# 한 호스트네임에 경로로 여러 MCP 서버를 얹을 수는 없다 — 이유는
# docs/DEPLOYMENT-TLS.md 의 "여러 MCP 서버 얹기" 참조.

server {
    listen 80;
    listen [::]:80;
    server_name mcp.ncurity.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mcp.ncurity.com;

    ssl_certificate     /etc/nginx/ssl/ncurity-wildcard/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/ncurity-wildcard/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:MCP_TLS:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/mcp.access.log;
    error_log  /var/log/nginx/mcp.error.log;

    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/mcp-proxy.inc;
    }
}

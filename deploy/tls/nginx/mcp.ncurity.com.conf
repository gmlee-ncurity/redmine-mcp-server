# /etc/nginx/conf.d/mcp.ncurity.com.conf
#
# Claude Code --HTTPS--> nginx(443) --HTTP--> redmine-mcp-tls (127.0.0.1:3001)
#
# OAuth 토큰 교환은 TLS를 강제하므로(루프백만 예외) 이 계층이 반드시 필요하다.
#
# MCP 서버를 추가할 때는 이 파일을 복사해 **새 서브도메인**으로 만든다.
# 한 호스트네임에 경로로 여러 MCP 서버를 얹을 수는 없다 — 이유는
# docs/DEPLOYMENT-TLS.md 의 "여러 MCP 서버 얹기" 참조.

server {
    listen 80;
    listen [::]:80;
    server_name mcp.ncurity.com;

    # certbot --webroot 를 쓸 경우를 대비해 ACME 경로만 열어둔다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mcp.ncurity.com;

    ssl_certificate     /etc/letsencrypt/live/mcp.ncurity.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.ncurity.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:MCP_TLS:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/mcp.access.log;
    error_log  /var/log/nginx/mcp.error.log;

    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/mcp-proxy.inc;
    }
}

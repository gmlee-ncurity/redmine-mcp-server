# nginx 컨테이너의 /etc/nginx/conf.d/default.conf 로 마운트된다.
#
# Claude Code --HTTPS--> nginx(:8443) --HTTP--> redmine-mcp:3000 (compose 네트워크)
#
# OAuth 토큰 교환은 TLS를 강제하므로(루프백만 예외) 이 계층이 반드시 필요하다.
#
# 443이 아닌 8443인 이유: 호스트의 443은 devel-dockerhub 레지스트리가 이미 점유 중이다.
# MCP는 issuer에 포트를 포함하면 되므로 비표준 포트로도 문제없이 동작한다.
#
# 인증서는 기존 *.ncurity.com 와일드카드를 재사용한다. 공인 CA(Sectigo) 발급이라
# 클라이언트 측 CA 설정이 전혀 필요 없고, 이름은 내부 DNS에만 등록하므로
# 서비스가 외부에 노출되지도 않는다.
#
# MCP 서버를 추가할 때는 이 파일에 server 블록을 추가한다(같은 nginx 컨테이너 재사용).
# 서버마다 **별도 서브도메인**이 필요하다 — 이유는
# docs/DEPLOYMENT-TLS.md 의 "여러 MCP 서버 얹기" 참조.

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name mcp.ncurity.com;

    ssl_certificate     /etc/nginx/ssl/ncurity-wildcard/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/ncurity-wildcard/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:MCP_TLS:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/mcp.access.log;
    error_log  /var/log/nginx/mcp.error.log;

    location / {
        # compose 서비스 이름으로 해석된다.
        proxy_pass http://redmine-mcp:3000;
        include /etc/nginx/snippets/mcp-proxy.inc;
    }
}
